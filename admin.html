<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SIGR · Panel de administración (CRUD del menú)" />
  <title>SIGR · Panel de Administración</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- =========================================================
       PANTALLA 3 · PANEL DE ADMINISTRACIÓN (CRUD DE MENÚ)
       Requiere sesión: sin sesión válido redirige a login.html
  ========================================================== -->
  <section id="admin-view" class="view view--admin">

    <!-- Barra superior -->
    <header class="topbar">
      <div class="topbar__brand">
        <span aria-hidden="true">🍽️</span>
        <span class="topbar__title">SIGR · Panel de Administración</span>
      </div>
      <div class="topbar__actions">
        <a class="btn btn--ghost btn--sm" href="index.html">Ver menú público</a>
        <span id="topbar-user" class="topbar__user">admin</span>
        <button id="logout-btn" class="btn btn--ghost" type="button">Cerrar sesión</button>
      </div>
    </header>

    <!-- Contenido principal -->
    <main class="admin-layout">

      <!-- ---------------- Formulario agregar / editar ---------------- -->
      <section class="panel" aria-labelledby="form-title">
        <div class="panel__header">
          <h2 id="form-title" class="panel__title">Agregar plato</h2>
          <span id="form-mode-badge" class="badge badge--create">Nuevo</span>
        </div>

        <form id="dish-form" class="dish-form" novalidate>
          <!-- Identificador del plato en modo edición (vacío = crear) -->
          <input type="hidden" id="dish-id" name="dishId" value="" />

          <!-- Nombre -->
          <div class="field">
            <label class="field__label" for="dish-name">Nombre *</label>
            <input
              class="field__input"
              type="text"
              id="dish-name"
              name="name"
              placeholder="Ej: Lomo saltado"
              maxlength="60"
              required
            />
          </div>

          <!-- Descripción -->
          <div class="field">
            <label class="field__label" for="dish-desc">Descripción *</label>
            <textarea
              class="field__input field__input--textarea"
              id="dish-desc"
              name="description"
              placeholder="Breve descripción del plato…"
              maxlength="180"
              rows="3"
              required
            ></textarea>
          </div>

          <!-- Precio -->
          <div class="field">
            <label class="field__label" for="dish-price">Valor / Precio (USD) *</label>
            <input
              class="field__input"
              type="number"
              id="dish-price"
              name="price"
              placeholder="Ej: 12.50"
              min="0"
              step="0.01"
              inputmode="decimal"
              required
            />
          </div>

          <!-- Imagen local (archivo desde la PC → Base64) -->
          <div class="field">
            <label class="field__label" for="dish-image">Imagen del plato *</label>
            <input
              class="field__file"
              type="file"
              id="dish-image"
              name="image"
              accept="image/*"
              required
            />
            <small id="file-name" class="field__hint"></small>

            <!-- Vista previa de la imagen seleccionada / actual -->
            <div id="image-preview-wrap" class="image-preview-wrap" hidden>
              <img id="image-preview" class="image-preview" alt="Vista previa del plato" hidden />
            </div>
          </div>

          <!-- Mensajes de validación -->
          <p id="form-message" class="form-message" role="status" hidden></p>

          <!-- Acciones -->
          <div class="form-actions">
            <button class="btn btn--primary" type="submit" id="submit-btn">Agregar plato</button>
            <button class="btn btn--secondary" type="button" id="cancel-edit-btn" hidden>Cancelar edición</button>
          </div>
        </form>
      </section>

      <!-- ---------------- Listado del menú ---------------- -->
      <section class="panel panel--menu" aria-labelledby="menu-title">
        <div class="panel__header">
          <h2 id="menu-title" class="panel__title">Menú actual</h2>
          <span id="dish-count" class="badge badge--count">0 platos</span>
        </div>

        <div id="menu-grid" class="menu-grid" aria-live="polite"></div>

        <div id="empty-state" class="empty-state">
          <span class="empty-state__icon" aria-hidden="true">👨‍🍳</span>
          <p class="empty-state__text">Aún no hay platos en el menú.</p>
          <p class="empty-state__hint">Agrega el primero usando el formulario.</p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <small>© 2026 SIGR · Sistema de Gestión de Restaurante</small>
    </footer>
  </section>

  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
