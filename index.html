<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SIGR · Menú del restaurante — vista pública del cliente" />
  <title>SIGR · Nuestro Menú</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- =========================================================
       VISTA DEL CLIENTE — Acceso público (sin autenticación)
  ========================================================== -->
  <section id="client-view" class="view view--client">

    <!-- Barra superior: marca + controles (esquina superior derecha) -->
    <header class="topbar">
      <div class="topbar__brand">
        <span aria-hidden="true">🍽️</span>
        <span class="topbar__title">SIGR · Nuestro Menú</span>
      </div>

      <div class="topbar__actions">
        <!-- Selector de vista: Cuadrícula / Lista -->
        <div class="view-toggle" role="group" aria-label="Selector de vista del menú">
          <button
            id="view-grid-btn"
            class="view-toggle__btn is-active"
            type="button"
            aria-pressed="true"
            title="Vista de cuadrícula"
            aria-label="Vista de cuadrícula"
          >
            <!-- Icono de cuadrícula (grid) -->
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <rect x="3" y="3" width="7.5" height="7.5" rx="1.6"></rect>
              <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"></rect>
              <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"></rect>
              <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"></rect>
            </svg>
          </button>

          <button
            id="view-list-btn"
            class="view-toggle__btn"
            type="button"
            aria-pressed="false"
            title="Vista de lista"
            aria-label="Vista de lista"
          >
            <!-- Icono de lista (list) -->
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <rect x="3" y="4.5" width="4" height="4" rx="1.2"></rect>
              <rect x="9.5" y="5.4" width="11.5" height="2.2" rx="1.1"></rect>
              <rect x="3" y="10.5" width="4" height="4" rx="1.2"></rect>
              <rect x="9.5" y="11.4" width="11.5" height="2.2" rx="1.1"></rect>
              <rect x="3" y="16.5" width="4" height="4" rx="1.2"></rect>
              <rect x="9.5" y="17.4" width="11.5" height="2.2" rx="1.1"></rect>
            </svg>
          </button>
        </div>

        <!-- Acceso al panel del administrador -->
        <a class="btn btn--ghost btn--sm" href="login.html">Administrador</a>
      </div>
    </header>

    <!-- Contenido principal -->
    <main class="client-layout">
      <section class="panel" aria-labelledby="menu-title">
        <div class="panel__header">
          <h1 id="menu-title" class="panel__title">Menú disponible</h1>
          <span id="dish-count" class="badge badge--count">0 platos disponibles</span>
        </div>

        <!-- Contenedor dinámico: alterna entre .menu-grid y .menu-list -->
        <div id="menu-container" class="menu-grid" data-view="grid" aria-live="polite"></div>

        <!-- Estado vacío -->
        <div id="empty-state" class="empty-state">
          <span class="empty-state__icon" aria-hidden="true">👨‍🍳</span>
          <p class="empty-state__text">Aún no hay platos disponibles.</p>
          <p class="empty-state__hint">El administrador los publicará en breve.</p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <small>© 2026 SIGR · Sistema de Gestión de Restaurante</small>
    </footer>
  </section>

  <script src="js/store.js"></script>
  <script src="js/client.js"></script>
</body>
</html>
